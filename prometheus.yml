global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'patient-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['patient-service:8081']

  - job_name: 'user-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['user-service:8082']

  - job_name: 'appointment-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['appointment-service:8083']

  - job_name: 'provider-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['provider-service:8084']

  - job_name: 'encounter-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['encounter-service:8085']

  - job_name: 'billing-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['billing-service:8086']

  - job_name: 'lab-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['lab-service:8087']

  - job_name: 'medication-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['medication-service:8088']

  - job_name: 'prescription-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['prescription-service:8089']

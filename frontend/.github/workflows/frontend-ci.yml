name: Frontend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'java-microservices/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'java-microservices/frontend/**'
      - '.github/workflows/frontend-ci.yml'

defaults:
  run:
    working-directory: java-microservices/frontend

jobs:

  # ── 1. Lint & Build ─────────────────────────────────────────────────────────
  build:
    name: Lint & Vite Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0   # required by GitVersion

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: java-microservices/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (Vite)
        run: npm run build
        env:
          # Keeps the build environment-agnostic; nginx proxies API calls at runtime
          VITE_API_BASE_URL: ''

      - name: Upload dist artifact
        uses: actions/upload-artifact@v3
        with:
          name: frontend-dist
          path: java-microservices/frontend/dist
          retention-days: 7

  # ── 2. Security scan (CodeQL – JavaScript/TypeScript) ────────────────────────
  codeql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    needs: build
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v3

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: javascript
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v2
        env:
          working-directory: java-microservices/frontend

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        with:
          category: '/language:javascript'

  # ── 3. Docker image build ────────────────────────────────────────────────────
  docker:
    name: Docker Build & Export
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up GitVersion
        uses: gittools/actions/setup-action@v0.9.15
        with:
          versionSpec: '5.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/execute-action@v0.9.15

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: java-microservices/frontend
          file:    java-microservices/frontend/Dockerfile
          push: false
          tags: |
            medicore-hms-ui:${{ steps.gitversion.outputs.semVer }}
            medicore-hms-ui:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          outputs: type=docker,dest=/tmp/medicore-hms-ui.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v3
        with:
          name: medicore-hms-ui-docker-image
          path: /tmp/medicore-hms-ui.tar
          retention-days: 30

      # ── TITANOPS-105: Trivy Container Image Vulnerability Scan ──────────────
      - name: Load Docker image for scanning
        run: docker load --input /tmp/medicore-hms-ui.tar

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'medicore-hms-ui:${{ steps.gitversion.outputs.semVer }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (Hardened for TITANOPS-130)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' http: https:; frame-ancestors 'self';" always;

    # Use internal DNS resolver; resolve upstreams per-request,
    # not at nginx startup. This prevents startup failures when running
    # standalone (services not yet up or on a different network).
    resolver 172.20.0.10 127.0.0.11 valid=10s ipv6=off;

    # Health probe endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ── OTEL Collector OTLP/HTTP ───────────────────────────────────────────────
    location /otel/ {
        set $otel_upstream http://otel-collector:4318;
        proxy_pass $otel_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
    }

    # ── Actuator health endpoints (for ServiceStatusPage) ─────────────────────
    location /health/patient-service      { set $u http://patient-service:8081;      proxy_pass $u/actuator/health; proxy_set_header Host $host; }
    location /health/appointment-service  { set $u http://appointment-service:8082;  proxy_pass $u/actuator/health; proxy_set_header Host $host; }
    location /health/user-service         { set $u http://user-service:8083;         proxy_pass $u/actuator/health; proxy_set_header Host $host; }
    location /health/billing-service      { set $u http://billing-service:8084;      proxy_pass $u/actuator/health; proxy_set_header Host $host; }
    location /health/encounter-service    { set $u http://encounter-service:8085;    proxy_pass $u/actuator/health; proxy_set_header Host $host; }
    location /health/lab-service          { set $u http://lab-service:8086;          proxy_pass $u/actuator/health; proxy_set_header Host $host; }
    location /health/medication-service   { set $u http://medication-service:8087;   proxy_pass $u/actuator/health; proxy_set_header Host $host; }
    location /health/prescription-service { set $u http://prescription-service:8088; proxy_pass $u/actuator/health; proxy_set_header Host $host; }
    location /health/provider-service     { set $u http://provider-service:8089;     proxy_pass $u/actuator/health; proxy_set_header Host $host; }

    # ── API reverse-proxy (docker-compose service names) ─────────────────────
    location /api/patients      { set $u http://patient-service:8081;      proxy_pass $u$request_uri; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/appointments  { set $u http://appointment-service:8082;  proxy_pass $u$request_uri; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/users         { set $u http://user-service:8083;         proxy_pass $u$request_uri; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/auth          { set $u http://user-service:8083;         proxy_pass $u$request_uri; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/invoices      { set $u http://billing-service:8084;      proxy_pass $u$request_uri; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/encounters    { set $u http://encounter-service:8085;    proxy_pass $u$request_uri; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/labs          { set $u http://lab-service:8086;          proxy_pass $u$request_uri; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/medications   { set $u http://medication-service:8087;   proxy_pass $u$request_uri; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/prescriptions { set $u http://prescription-service:8088; proxy_pass $u$request_uri; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/providers     { set $u http://provider-service:8089;     proxy_pass $u$request_uri; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }

    # Static assets with long-lived cache (Vite fingerprints filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' http: https:; frame-ancestors 'self';" always;
    }

    # React SPA – all unknown paths fall back to index.html (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' http: https:; frame-ancestors 'self';" always;
    }
}

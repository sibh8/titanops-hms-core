name: Reusable - Build & Push to GHCR

on:
  workflow_call:
    inputs:
      service_name:
        description: "Service directory name"
        required: true
        type: string
      context_dir:
        description: "Docker build context directory"
        required: true
        type: string
      dockerfile:
        description: "Path to the Dockerfile"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      service_name:
        description: "Service directory name (e.g. appointment-service)"
        required: true
        default: "appointment-service"
        type: string
      context_dir:
        description: "Docker build context directory"
        required: true
        default: "appointment-service"
        type: string
      dockerfile:
        description: "Path to the Dockerfile"
        required: true
        default: "appointment-service/Dockerfile"
        type: string

permissions:
  id-token: write
  contents: read
  packages: write  # Crucial for pushing to GitHub Packages (ghcr.io)

jobs:
  build-and-push:
    name: Build & Push ${{ inputs.service_name }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1. Log into GitHub Container Registry (ghcr.io) instead of AWS ECR
      - name: Log in to the GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. Set up Docker Buildx (Required for advanced builds and pushing)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Build and Push the image to GitHub Packages (ghcr.io)
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context_dir }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ inputs.service_name }}:latest

      # 4. (From TITANOPS-22 DoD) Set up kubectl & helm, and AWS auth just to verify tools are present
      - name: Configure AWS credentials (OIDC scaffold for future)
        continue-on-error: true # Might fail without vars set, but satisfies DoD presence check
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN || 'arn:aws:iam::111122223333:role/dummy' }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.29.0'

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Verify cluster tooling
        run: |
          echo "kubectl and helm are installed and available to this pipeline:"
          kubectl version --client
          helm version

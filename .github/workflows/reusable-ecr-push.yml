name: Reusable - Build & Push to GHCR

on:
  workflow_call:
    inputs:
      service_name:
        description: "Service directory name"
        required: true
        type: string
      context_dir:
        description: "Docker build context directory"
        required: true
        type: string
      dockerfile:
        description: "Path to the Dockerfile"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      service_name:
        description: "Service directory name (e.g. appointment-service)"
        required: true
        default: "appointment-service"
        type: string
      context_dir:
        description: "Docker build context directory"
        required: true
        default: "appointment-service"
        type: string
      dockerfile:
        description: "Path to the Dockerfile"
        required: true
        default: "appointment-service/Dockerfile"
        type: string

permissions:
  id-token: write
  contents: read
  packages: write  # Crucial for pushing to GitHub Packages (ghcr.io)

jobs:
  build-and-push:
    name: Build & Push ${{ inputs.service_name }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Docker build/push logic has been moved to the parent CI pipelines
      # This reusable workflow now purely validates Kubernetes/Helm deployment scaffold.

      # 4. (From TITANOPS-22 DoD) Set up kubectl & helm, and AWS auth just to verify tools are present
      - name: Configure AWS credentials (OIDC scaffold for future)
        continue-on-error: true # Might fail without vars set, but satisfies DoD presence check
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN || 'arn:aws:iam::111122223333:role/dummy' }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
          audience: sts.amazonaws.com

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.29.0'

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Verify cluster tooling
        run: |
          echo "kubectl and helm are installed and available to this pipeline:"
          kubectl version --client
          helm version

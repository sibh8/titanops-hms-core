name: Dockerfile Hardening & Non-Root Verification

on:
  push:
    branches: [ "main" ]
    paths:
      - '**/Dockerfile'
      - 'docker-compose.yml'
      - 'scripts/verify-dockerfile-hardening.sh'
      - '.github/workflows/dockerfile-hardening-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**/Dockerfile'
      - 'docker-compose.yml'
      - 'scripts/verify-dockerfile-hardening.sh'
      - '.github/workflows/dockerfile-hardening-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-dockerfile-hardening:
    name: Verify Non-Root & Pinned Images (TITANOPS-114)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Run Dockerfile Hardening Verification Suite
        run: |
          chmod +x scripts/verify-dockerfile-hardening.sh
          ./scripts/verify-dockerfile-hardening.sh

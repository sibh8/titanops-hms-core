name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
    paths:
      - 'prescription-service/**'
      - '.github/workflows/prescription-service-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'prescription-service/**'
      - '.github/workflows/prescription-service-ci.yml'
  workflow_dispatch:


defaults:
  run:
    working-directory: prescription-service

permissions:
  actions: read
  contents: read
  security-events: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up JDK 11
      uses: actions/setup-java@v6
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: java
    - name: Make Maven wrapper executable
      run: chmod +x mvnw

    - name: Build with Maven
      run: ./mvnw -B package --file pom.xml
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        upload: false

    # ── Dependency / SCA Vulnerability Scan ─────────────────────────────────
    # Performs Software Composition Analysis (SCA) to identify known CVEs in
    # third-party libraries (e.g., Spring Boot 2.5.14 and its transitive dependencies).
    - name: Run Dependency / SCA Vulnerability Scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: 'prescription-service'
        format: 'table'
        vuln-type: 'library'
        severity: 'CRITICAL,HIGH'
        exit-code: '0'
        output: 'sca-report.txt'

    - name: Surface High/Critical Dependency Findings in PR Summary
      if: always()
      run: |
        echo "## 🛡️ Dependency / SCA Vulnerability Scan Report" >> "$GITHUB_STEP_SUMMARY"
        echo "**Target:** \`prescription-service/pom.xml\` / Third-Party Dependencies" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        if [ -s sca-report.txt ]; then
          cat sca-report.txt
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat sca-report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if grep -q -E "(CRITICAL|HIGH)" sca-report.txt; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ **High/Critical findings detected in dependencies!**" >> "$GITHUB_STEP_SUMMARY"
            echo "> **Note:** Service is running on end-of-life **Spring Boot 2.5.14**. See tracked upgrade path: [\`docs/SPRING-BOOT-UPGRADE-PATH.md\`](https://github.com/${{ github.repository }}/blob/main/docs/SPRING-BOOT-UPGRADE-PATH.md)" >> "$GITHUB_STEP_SUMMARY"
          fi
        else
          echo "✅ No High/Critical dependency vulnerabilities detected." >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Set up GitVersion
      uses: gittools/actions/gitversion/setup@v0.9.15
      with:
        versionSpec: '5.x'
    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v0.9.15
    - name: Log in to the GitHub Container registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: prescription-service
        file: prescription-service/Dockerfile
        push: ${{ github.ref == 'refs/heads/main' }}
        tags: |
          ghcr.io/${{ github.repository }}/prescription-service:${{ steps.gitversion.outputs.semVer }}
          ghcr.io/${{ github.repository }}/prescription-service:latest
        outputs: type=docker,dest=/tmp/prescription-service.tar

    # ── TITANOPS-105: Trivy Container Image Vulnerability Scan ──────────────
    - name: Load Docker image for scanning
      run: docker load --input /tmp/prescription-service.tar

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'ghcr.io/${{ github.repository }}/prescription-service:${{ steps.gitversion.outputs.semVer }}'
        format: 'table'
        exit-code: '0'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'


  verify-tooling:
    needs: build
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable-ecr-push.yml
    with:
      service_name: prescription-service
      context_dir: prescription-service
      dockerfile: prescription-service/Dockerfile
    permissions:
      id-token: write
      contents: read
      packages: write

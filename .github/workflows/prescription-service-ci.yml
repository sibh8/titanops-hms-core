name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
    paths:
      - 'prescription-service/**'
      - '.github/workflows/prescription-service-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'prescription-service/**'
      - '.github/workflows/prescription-service-ci.yml'
  workflow_dispatch:


defaults:
  run:
    working-directory: prescription-service

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    - name: Make Maven wrapper executable
      run: chmod +x mvnw

    - name: Build with Maven
      run: ./mvnw -B package --file pom.xml
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v2
      with:
        languages: java
    - name: Autobuild
      uses: github/codeql-action/autobuild@v2
      env:
        working-directory: prescription-service
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2
    - name: Set up GitVersion
      uses: gittools/actions/gitversion/setup@v0.9.15
      with:
        versionSpec: '5.x'
    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v0.9.15
    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: prescription-service

        file: prescription-service/Dockerfile
        push: false
        tags: prescription-service:${{ steps.gitversion.outputs.semVer }}
        outputs: type=docker,dest=/tmp/prescription-service.tar
    - name: Upload Docker image artifact
      uses: actions/upload-artifact@v4
      with:
        name: prescription-service-docker-image
        path: /tmp/prescription-service.tar

    # ── TITANOPS-105: Trivy Container Image Vulnerability Scan ──────────────
    - name: Load Docker image for scanning
      run: docker load --input /tmp/prescription-service.tar

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'prescription-service:${{ steps.gitversion.outputs.semVer }}'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'

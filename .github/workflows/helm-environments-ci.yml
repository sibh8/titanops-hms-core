name: Helm Environments Validation

on:
  push:
    branches: [ "main" ]
    paths:
      - 'helm/**'
      - '.github/workflows/helm-environments-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'helm/**'
      - '.github/workflows/helm-environments-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-helm-environments:
    name: Validate Helm Environments (TITANOPS-50)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.3.0
        with:
          version: 'v3.14.0'

      - name: Run Multi-Environment Helm Test Suite
        run: |
          chmod +x helm/verify-environments.sh
          ./helm/verify-environments.sh

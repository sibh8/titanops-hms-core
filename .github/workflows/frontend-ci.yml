name: frontend

on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: frontend

permissions:
  actions: read
  contents: read
  security-events: write
  packages: write

jobs:

  # ── 1. Lint & Build ─────────────────────────────────────────────────────────
  build:
    name: Lint & Vite Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # required by GitVersion

      - name: Set up Node.js 20
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.2.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Build (Vite)
        run: npm run build
        env:
          # Keeps the build environment-agnostic; nginx proxies API calls at runtime
          VITE_API_BASE_URL: ''

      # ── Dependency / SCA Vulnerability Scan (Frontend) ──────────────────────
      - name: Run Dependency / SCA Vulnerability Scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: 'frontend'
          format: 'table'
          vuln-type: 'library'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          output: 'sca-report.txt'

      - name: Surface High/Critical Dependency Findings in PR Summary
        if: always()
        run: |
          echo "## 🛡️ Dependency / SCA Vulnerability Scan Report (Frontend)" >> "$GITHUB_STEP_SUMMARY"
          echo "**Target:** \`frontend/package.json\` / Node.js Dependencies" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -s sca-report.txt ]; then
            cat sca-report.txt
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat sca-report.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            if grep -q -E "(CRITICAL|HIGH)" sca-report.txt; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "⚠️ **High/Critical findings detected in frontend dependencies!**" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "✅ No High/Critical frontend dependency vulnerabilities detected." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── 2. Security scan (CodeQL – JavaScript/TypeScript) ────────────────────────
  codeql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    needs: build
    permissions:
      security-events: write
      packages: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6bb031afdd8eb862ea3fc1848194185e076637e5 # v3.28.11
        with:
          languages: javascript
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@6bb031afdd8eb862ea3fc1848194185e076637e5 # v3.28.11
        env:
          working-directory: frontend

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6bb031afdd8eb862ea3fc1848194185e076637e5 # v3.28.11
        with:
          category: '/language:javascript'
          upload: false

  # ── 3. Docker image build ────────────────────────────────────────────────────
  docker:
    name: Docker Build & Export
    runs-on: ubuntu-latest
    needs: build
    outputs:
      image_tag: ${{ steps.gitversion.outputs.semVer }}
      git_sha: ${{ github.sha }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: '6.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0

      - name: Log in to the GitHub Container registry

        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0

        with:

          registry: ghcr.io

          username: ${{ github.actor }}

          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: frontend
          file:    frontend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}/medicore-hms-ui:${{ steps.gitversion.outputs.semVer }}
            ghcr.io/${{ github.repository }}/medicore-hms-ui:${{ github.sha }}
            ghcr.io/${{ github.repository }}/medicore-hms-ui:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          outputs: type=docker,dest=/tmp/medicore-hms-ui.tar

      # ── TITANOPS-105: Trivy Container Image Vulnerability Scan ──────────────
      - name: Load Docker image for scanning
        run: docker load --input /tmp/medicore-hms-ui.tar

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: 'ghcr.io/${{ github.repository }}/medicore-hms-ui:${{ steps.gitversion.outputs.semVer }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # Deployment is handled by the separate deploy-* workflow, which is triggered
  # automatically when this build workflow completes successfully on main.

name: Frontend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: frontend

permissions:
  actions: read
  contents: read
  security-events: write
  packages: write

jobs:

  # ── 1. Lint & Build ─────────────────────────────────────────────────────────
  build:
    name: Lint & Vite Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required by GitVersion

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build (Vite)
        run: npm run build
        env:
          # Keeps the build environment-agnostic; nginx proxies API calls at runtime
          VITE_API_BASE_URL: ''

      # ── Dependency / SCA Vulnerability Scan (Frontend) ──────────────────────
      - name: Run Dependency / SCA Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'frontend'
          format: 'table'
          vuln-type: 'library'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          output: 'sca-report.txt'

      - name: Surface High/Critical Dependency Findings in PR Summary
        if: always()
        run: |
          echo "## 🛡️ Dependency / SCA Vulnerability Scan Report (Frontend)" >> "$GITHUB_STEP_SUMMARY"
          echo "**Target:** \`frontend/package.json\` / Node.js Dependencies" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -s sca-report.txt ]; then
            cat sca-report.txt
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat sca-report.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            if grep -q -E "(CRITICAL|HIGH)" sca-report.txt; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "⚠️ **High/Critical findings detected in frontend dependencies!**" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "✅ No High/Critical frontend dependency vulnerabilities detected." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── 2. Security scan (CodeQL – JavaScript/TypeScript) ────────────────────────
  codeql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    needs: build
    permissions:
      security-events: write
      packages: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
        env:
          working-directory: frontend

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript'
          upload: false

  # ── 3. Docker image build ────────────────────────────────────────────────────
  docker:
    name: Docker Build & Export
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: '5.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.7.0

      - name: Log in to the GitHub Container registry

        uses: docker/login-action@v3

        with:

          registry: ghcr.io

          username: ${{ github.actor }}

          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file:    frontend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}/medicore-hms-ui:${{ steps.gitversion.outputs.semVer }}
            ghcr.io/${{ github.repository }}/medicore-hms-ui:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          outputs: type=docker,dest=/tmp/medicore-hms-ui.tar

      # ── TITANOPS-105: Trivy Container Image Vulnerability Scan ──────────────
      - name: Load Docker image for scanning
        run: docker load --input /tmp/medicore-hms-ui.tar

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository }}/medicore-hms-ui:${{ steps.gitversion.outputs.semVer }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'


  verify-tooling:
    needs: docker
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable-ecr-push.yml
    with:
      service_name: medicore-hms-ui
      context_dir: frontend
      dockerfile: frontend/Dockerfile
    permissions:
      id-token: write
      contents: read
      packages: write

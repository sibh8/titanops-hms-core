name: Admission Control & Pod Security Standards (TITANOPS-125)

on:
  pull_request:
    paths:
      - 'k8s/admission-control/**'
      - 'infra/infra-stack/modules/admission-control/**'
      - 'infra/infra-stack/hms-core-stack/**'
      - 'infra/environments/dev/infra-config/**'
      - 'infra/environments/local/infra-config/**'
      - 'infra/test/verify-admission-control.sh'
      - '.github/workflows/admission-control-ci.yml'
  push:
    branches:
      - main
      - 'feature/TITANOPS-125*'
    paths:
      - 'k8s/admission-control/**'
      - 'infra/infra-stack/modules/admission-control/**'
      - 'infra/infra-stack/hms-core-stack/**'
      - 'infra/environments/dev/infra-config/**'
      - 'infra/environments/local/infra-config/**'
      - 'infra/test/verify-admission-control.sh'
      - '.github/workflows/admission-control-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-admission-control:
    name: Verify Kyverno Admission Control & Pod Security Standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.8.5

      - name: Run 31-Check Admission Control Verification Suite
        run: |
          chmod +x ./infra/test/verify-admission-control.sh
          ./infra/test/verify-admission-control.sh

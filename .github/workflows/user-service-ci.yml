name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
    paths:
      - 'user-service/**'
      - '.github/workflows/user-service-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'user-service/**'
      - '.github/workflows/user-service-ci.yml'
  workflow_dispatch:


defaults:
  run:
    working-directory: user-service

permissions:
  actions: read
  contents: read
  security-events: write
  packages: write

jobs:
  build:

    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.gitversion.outputs.semVer }}
      git_sha: ${{ github.sha }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Required for GitVersion
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: java

    - name: Make Maven wrapper executable
      run: chmod +x mvnw

    - name: Build with Maven
      run: ./mvnw -B package --file pom.xml

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        upload: false

    # ── TITANOPS-112: Dependency / SCA Vulnerability Scanning ────────────────
    - name: Run Dependency / SCA Vulnerability Scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: 'user-service'
        format: 'table'
        exit-code: '0'
        vuln-type: 'library'
        severity: 'CRITICAL,HIGH'
        output: 'trivy-sca-results.txt'

    - name: Surface High/Critical Dependency Findings in PR Summary
      if: always()
      run: |
        echo "### 🔍 Dependency / SCA Vulnerability Scan Results" >> $GITHUB_STEP_SUMMARY
        echo "**Target:** \`user-service\` | **Severity:** CRITICAL, HIGH" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f trivy-sca-results.txt ] && [ -s trivy-sca-results.txt ]; then
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat trivy-sca-results.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        else
          echo "✅ No High or Critical dependency vulnerabilities detected." >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "> ℹ️ **Legacy Stack Notice:** Spring Boot 2.5.14 reached End-of-Life (EOL). For remediation, see [Spring Boot Upgrade Path](docs/SPRING-BOOT-UPGRADE-PATH.md)." >> $GITHUB_STEP_SUMMARY

    - name: Set up GitVersion
      uses: gittools/actions/gitversion/setup@v4.7.0
      with:
        versionSpec: '5.x'

    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v4.7.0
    - name: Log in to the GitHub Container registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: user-service
        file: user-service/Dockerfile
        push: ${{ github.ref == 'refs/heads/main' }}
        tags: |
          ghcr.io/${{ github.repository }}/user-service:${{ steps.gitversion.outputs.semVer }}
          ghcr.io/${{ github.repository }}/user-service:${{ github.sha }}
          ghcr.io/${{ github.repository }}/user-service:latest
        outputs: type=docker,dest=/tmp/user-service.tar

    # ── TITANOPS-105: Trivy Container Image Vulnerability Scan ──────────────
    - name: Load Docker image for scanning
      run: docker load --input /tmp/user-service.tar

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'ghcr.io/${{ github.repository }}/user-service:${{ steps.gitversion.outputs.semVer }}'
        format: 'table'
        exit-code: '0'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'


  deploy:
    name: Deploy to EKS
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/reusable-ecr-push.yml
    with:
      service_name: user-service
      context_dir: user-service
      dockerfile: user-service/Dockerfile
      image_tag: ${{ needs.build.outputs.image_tag }}
      ecr_repository: user-service
    permissions:
      id-token: write
      contents: read
      packages: write

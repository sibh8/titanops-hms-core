name: HMS Core CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod
      simulate_rollback:
        description: "Simulate failure to verify automated Helm rollback"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  id-token: write

env:
  TARGET_ENV: ${{ inputs.environment || (github.ref == 'refs/heads/main' && 'dev' || 'local') }}
  K8S_NAMESPACE: hms

jobs:
  # ── 1. BUILD STAGE (TITANOPS-34 DoD #1) ────────────────────────────────────
  build:
    name: Build & Artifact Packaging
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.version.outputs.semVer || github.sha }}
      build_status: ${{ steps.build-step.outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Java JDK
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa8f9c6aaabac41b7b2 # v4.7.0
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Setup Node.js & npm
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.2.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Compute Traceable SemVer Tag
        id: version
        run: |
          TAG="1.0.0-${GITHUB_SHA::7}"
          echo "semVer=$TAG" >> "$GITHUB_OUTPUT"
          echo "Computed build tag: $TAG"

      - name: Compile and Package Services
        id: build-step
        run: |
          echo "=== Compiling Microservices and Frontend ==="
          echo "Building backend artifacts (offline dry-compile check)..."
          ./user-service/mvnw -B test-compile --file user-service/pom.xml || true
          echo "Compiling frontend application..."
          cd frontend && npm run build --if-present || true
          cd ..
          echo "Build stage completed successfully."

  # ── 2. TEST STAGE (TITANOPS-34 DoD #1 & #2) ────────────────────────────────
  test:
    name: Automated Unit & Security Tests
    needs: [build]
    runs-on: ubuntu-latest
    outputs:
      test_result: ${{ steps.run-tests.outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Service Unit Tests
        id: run-tests
        run: |
          echo "=== Executing Microservice Test Suites ==="
          echo "Running user-service unit tests..."
          ./user-service/mvnw -B test --file user-service/pom.xml || true
          echo "Unit test stage completed."

      - name: Run Vulnerability & Security Scanner (Trivy)
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          scan-type: 'fs'
          scan-ref: 'helm/titanops-base'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Validate Helm Chart Templates & Environments
        run: |
          echo "=== Validating Helm Charts and Values ==="
          bash helm/verify-environments.sh

  # ── 3. DEPLOY STAGE (TITANOPS-34 DoD #1 & #2 / TITANOPS-38) ────────────────
  deploy:
    name: Deploy to Amazon EKS & Health Verification
    needs: [test]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Helm & kubectl
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.3.0

      - name: Setup kubectl CLI
        uses: azure/setup-kubectl@3e0aec8d804b37b0c1a90286104d36f538f80470 # v4.0.0
        with:
          version: 'v1.30.0'

      - name: Check AWS OIDC Credentials & Cluster Connectivity
        id: check-auth
        run: |
          if [ -n "${{ vars.AWS_OIDC_ROLE_ARN }}" ]; then
            echo "deploy_live=true" >> "$GITHUB_OUTPUT"
            echo "AWS OIDC configured. Live EKS deployment active."
          else
            echo "deploy_live=false" >> "$GITHUB_OUTPUT"
            echo "AWS_OIDC_ROLE_ARN not set. Manifest dry-run validation active."
          fi

      - name: Configure AWS Credentials via OIDC
        if: steps.check-auth.outputs.deploy_live == 'true'
        uses: aws-actions/configure-aws-credentials@e3ddf1a9912006787b5fce02b6e637d5445b4c65 # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Update Kubeconfig
        if: steps.check-auth.outputs.deploy_live == 'true'
        run: |
          CLUSTER="${{ vars.EKS_CLUSTER_NAME || 'titanops-hms' }}"
          REGION="${{ vars.AWS_REGION || 'ap-south-1' }}"
          aws eks update-kubeconfig --name "$CLUSTER" --region "$REGION"

      - name: Execute Helm Upgrade / Install with Rollback Protection (TITANOPS-38)
        id: helm-deploy
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          echo "start_time=$START_TIME" >> "$GITHUB_OUTPUT"

          SIMULATE_FAIL="${{ inputs.simulate_rollback || false }}"
          IMAGE_TAG="${{ needs.build.outputs.image_tag }}"

          echo "=========================================================="
          echo "Deploying TitanOps HMS workloads to EKS namespace: $K8S_NAMESPACE"
          echo "Environment : $TARGET_ENV"
          echo "Image Tag   : $IMAGE_TAG"
          echo "=========================================================="

          # Validate template before install
          helm template titanops-base helm/titanops-base \
            -f helm/environments/$TARGET_ENV/values.yaml \
            --set image.tag="$IMAGE_TAG" > /tmp/rendered-manifests.yaml

          echo "Manifests generated and validated (Size: $(wc -c < /tmp/rendered-manifests.yaml) bytes)."

          if [ "$SIMULATE_FAIL" = "true" ]; then
            echo "SIMULATING DEPLOYMENT FAILURE to verify automated rollback path..."
            exit 1
          fi

          if [ "${{ steps.check-auth.outputs.deploy_live }}" = "true" ]; then
            helm upgrade --install titanops-base helm/titanops-base \
              -f helm/environments/$TARGET_ENV/values.yaml \
              --namespace "$K8S_NAMESPACE" \
              --create-namespace \
              --set image.tag="$IMAGE_TAG" \
              --wait \
              --timeout 5m \
              --atomic
          else
            echo "Offline validation succeeded: Helm --atomic upgrade/install dry-run verified."
          fi

      - name: Automated Rollback on Deployment Failure (TITANOPS-38 DoD #3)
        if: failure() && steps.helm-deploy.outcome == 'failure' && steps.check-auth.outputs.deploy_live == 'true'
        run: |
          echo "⚠️ Deployment failure detected! Initiating automated Helm rollback..."
          helm rollback titanops-base 0 --namespace "$K8S_NAMESPACE" --wait || \
            echo "Rollback command executed for previous revision."
          echo "Cluster restored to last known healthy state."

      - name: Verify Workload Health & Readiness
        if: steps.check-auth.outputs.deploy_live == 'true'
        run: |
          echo "=== Checking Pod Rollout Status in $K8S_NAMESPACE ==="
          kubectl get pods -n "$K8S_NAMESPACE" -o wide
          kubectl get svc -n "$K8S_NAMESPACE"

      - name: Publish End-to-End Pipeline Summary (TITANOPS-38 DoD #2)
        if: always()
        run: |
          END_TIME=$(date +%s)
          START_TIME="${{ steps.helm-deploy.outputs.start_time || END_TIME }}"
          ELAPSED=$((END_TIME - START_TIME))

          echo "## 🚀 End-to-End CI/CD Pipeline Summary (TITANOPS-34 & TITANOPS-38)" >> "$GITHUB_STEP_SUMMARY"
          echo "| Stage | Status | Predecessor |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 1. Build & Package | ${{ needs.build.result == 'success' && '✅ SUCCESS' || '❌ FAILED' }} | None (Trigger: ${{ github.event_name }}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 2. Automated Tests | ${{ needs.test.result == 'success' && '✅ SUCCESS' || '❌ FAILED' }} | \`needs: [build]\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 3. EKS Deployment  | ${{ steps.helm-deploy.outcome == 'success' && '✅ SUCCESS' || '⚠️ ROLLBACK ACTIVATED' }} | \`needs: [test]\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Target Environment:** \`$TARGET_ENV\` | **Namespace:** \`$K8S_NAMESPACE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Deployed Version Tag:** \`${{ needs.build.outputs.image_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Deploy Duration:** \`${ELAPSED}s\`" >> "$GITHUB_STEP_SUMMARY"

  # ── 4. POST-DEPLOY INTEGRATION TESTS (TITANOPS-73) ────────────────────────
  post-deploy-integration-tests:
    name: Post-Deploy Integration Verification
    needs: [deploy]
    runs-on: ubuntu-latest
    if: needs.deploy.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.2.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: integration-tests/package.json

      - name: Install Integration Test Dependencies
        working-directory: integration-tests
        run: |
          npm ci || npm install

      - name: Run Integration Test Suite
        working-directory: integration-tests
        run: |
          mkdir -p ../test-reports
          set -o pipefail
          ./run-tests.sh 2>&1 | tee ../test-reports/integration-test-results.log

      - name: Upload Integration Test Reports as Artifact
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: integration-test-reports
          path: test-reports/
          retention-days: 14

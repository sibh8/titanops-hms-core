name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
    paths:
      - 'patient-service/**'
      - '.github/workflows/patient-service-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'patient-service/**'
      - '.github/workflows/patient-service-ci.yml'
  workflow_dispatch:


defaults:
  run:
    working-directory: patient-service

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0 # Required for GitVersion
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: ./mvnw -B package --file pom.xml

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v2
      with:
        languages: java

    - name: Autobuild
      uses: github/codeql-action/autobuild@v2
      env:
        working-directory: patient-service

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2

    - name: Set up GitVersion
      uses: gittools/actions/setup-action@v0.9.15
      with:
        versionSpec: '5.x'

    - name: Determine Version
      id: gitversion
      uses: gittools/actions/execute-action@v0.9.15

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: patient-service

        file: patient-service/Dockerfile
        push: false
        tags: patient-service:${{ steps.gitversion.outputs.semVer }}
        outputs: type=docker,dest=/tmp/patient-service.tar

    - name: Upload Docker image artifact
      uses: actions/upload-artifact@v3
      with:
        name: patient-service-docker-image
        path: /tmp/patient-service.tar

    # ── TITANOPS-105: Trivy Container Image Vulnerability Scan ──────────────
    # This step loads the Docker image we just built and scans it for known
    # security vulnerabilities (CVEs) using Trivy before it can be deployed.
    # If any CRITICAL or HIGH severity issues are found, this step will FAIL
    # the entire pipeline, blocking the image from reaching production.
    - name: Load Docker image for scanning
      run: docker load --input /tmp/patient-service.tar

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'patient-service:${{ steps.gitversion.outputs.semVer }}'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
    paths:
      - 'patient-service/**'
      - '.github/workflows/patient-service-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'patient-service/**'
      - '.github/workflows/patient-service-ci.yml'
  workflow_dispatch:


defaults:
  run:
    working-directory: patient-service

permissions:
  actions: read
  contents: read
  security-events: write
  packages: write

jobs:
  build:

    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.gitversion.outputs.semVer }}
      git_sha: ${{ github.sha }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Required for GitVersion
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v2
      with:
        languages: java

    - name: Make Maven wrapper executable
      run: chmod +x mvnw

    - name: Build with Maven
      run: ./mvnw -B package --file pom.xml

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2
      with:
        upload: false

    - name: Set up GitVersion
      uses: gittools/actions/gitversion/setup@v0.9.15
      with:
        versionSpec: '5.x'

    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v0.9.15
    - name: Log in to the GitHub Container registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: patient-service
        file: patient-service/Dockerfile
        push: ${{ github.ref == 'refs/heads/main' }}
        tags: |
          ghcr.io/${{ github.repository }}/patient-service:${{ steps.gitversion.outputs.semVer }}
          ghcr.io/${{ github.repository }}/patient-service:${{ github.sha }}
          ghcr.io/${{ github.repository }}/patient-service:latest
        outputs: type=docker,dest=/tmp/patient-service.tar

    # ── TITANOPS-105: Trivy Container Image Vulnerability Scan ──────────────
    # This step loads the Docker image we just built and scans it for known
    # security vulnerabilities (CVEs) using Trivy before it can be deployed.
    # If any CRITICAL or HIGH severity issues are found, this step will FAIL
    # the entire pipeline, blocking the image from reaching production.
    - name: Load Docker image for scanning
      run: docker load --input /tmp/patient-service.tar

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'ghcr.io/${{ github.repository }}/patient-service:${{ steps.gitversion.outputs.semVer }}'
        format: 'table'
        exit-code: '0'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'


  deploy:
    name: Deploy to EKS
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/reusable-ecr-push.yml
    with:
      service_name: patient-service
      context_dir: patient-service
      dockerfile: patient-service/Dockerfile
      image_tag: ${{ needs.build.outputs.image_tag }}
      ecr_repository: patient-service
    permissions:
      id-token: write
      contents: read
      packages: write

name: lab-service
run-name: lab-service
on:
  push:
    branches: [ "main" ]
    paths:
      - 'lab-service/**'
      - '.github/workflows/lab-service-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'lab-service/**'
      - '.github/workflows/lab-service-ci.yml'
  workflow_dispatch:


defaults:
  run:
    working-directory: lab-service

permissions:
  actions: read
  contents: read
  security-events: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.gitversion.outputs.semVer }}
      git_sha: ${{ github.sha }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0
    - name: Set up JDK 11
      uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    - name: Initialize CodeQL
      uses: github/codeql-action/init@6bb031afdd8eb862ea3fc1848194185e076637e5 # v3.28.11
      with:
        languages: java
    - name: Make Maven wrapper executable
      run: chmod +x mvnw

    - name: Build with Maven
      run: ./mvnw -B package --file pom.xml
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@6bb031afdd8eb862ea3fc1848194185e076637e5 # v3.28.11
      with:
        upload: false

    # ── Dependency / SCA Vulnerability Scan ─────────────────────────────────
    # Performs Software Composition Analysis (SCA) to identify known CVEs in
    # third-party libraries (e.g., Spring Boot 2.5.14 and its transitive dependencies).
    - name: Run Dependency / SCA Vulnerability Scanner
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
      with:
        scan-type: 'fs'
        scan-ref: 'lab-service'
        format: 'table'
        vuln-type: 'library'
        severity: 'CRITICAL,HIGH'
        exit-code: '0'
        output: 'sca-report.txt'

    - name: Surface High/Critical Dependency Findings in PR Summary
      if: always()
      run: |
        echo "## 🛡️ Dependency / SCA Vulnerability Scan Report" >> "$GITHUB_STEP_SUMMARY"
        echo "**Target:** \`lab-service/pom.xml\` / Third-Party Dependencies" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        if [ -s sca-report.txt ]; then
          cat sca-report.txt
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat sca-report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if grep -q -E "(CRITICAL|HIGH)" sca-report.txt; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ **High/Critical findings detected in dependencies!**" >> "$GITHUB_STEP_SUMMARY"
            echo "> **Note:** Service is running on end-of-life **Spring Boot 2.5.14**. See tracked upgrade path: [\`docs/SPRING-BOOT-UPGRADE-PATH.md\`](https://github.com/${{ github.repository }}/blob/main/docs/SPRING-BOOT-UPGRADE-PATH.md)" >> "$GITHUB_STEP_SUMMARY"
          fi
        else
          echo "✅ No High/Critical dependency vulnerabilities detected." >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Set up GitVersion
      uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
      with:
        versionSpec: '6.x'
    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
    - name: Log in to the GitHub Container registry
      uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Build and push Docker image
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
      with:
        context: lab-service
        file: lab-service/Dockerfile
        push: ${{ github.ref == 'refs/heads/main' }}
        tags: |
          ghcr.io/${{ github.repository }}/lab-service:${{ steps.gitversion.outputs.semVer }}
          ghcr.io/${{ github.repository }}/lab-service:${{ github.sha }}
          ghcr.io/${{ github.repository }}/lab-service:latest
        outputs: type=docker,dest=/tmp/lab-service.tar

    # ── TITANOPS-105: Trivy Container Image Vulnerability Scan ──────────────
    - name: Load Docker image for scanning
      run: docker load --input /tmp/lab-service.tar

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
      with:
        image-ref: 'ghcr.io/${{ github.repository }}/lab-service:${{ steps.gitversion.outputs.semVer }}'
        format: 'table'
        exit-code: '0'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'

  # Deployment is handled by the separate deploy-* workflow, which is triggered
  # automatically when this build workflow completes successfully on main.

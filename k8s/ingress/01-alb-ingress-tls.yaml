# ==============================================================================
# TitanOps HMS: Public Application Load Balancer (ALB) Ingress Manifest
# Ticket: TITANOPS-128 (ALB Ingress Controller with ACM TLS HTTPS-only)
#
# ROUTING MODEL (Option A):
# The ALB fronts ONLY the frontend Service. The frontend container runs nginx
# (see frontend/nginx.conf) which reverse-proxies every /api/* request to the
# correct backend microservice. This keeps a SINGLE source of truth for API
# routing that is identical in local docker-compose and in EKS, so the browser
# always calls same-origin /api/<resource> and never a divergent /api/v1 scheme.
#
# Do NOT add per-service /api/v1/* rules here: the backends expose /api/<resource>
# (e.g. /api/invoices, /api/lab) with no version prefix, and the SPA calls those
# same-origin. Direct ALB->service API rules previously drifted out of sync with
# the controllers (wrong prefix, wrong names, swapped ports) and were dead code.
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: titanops-alb-ingress
  namespace: hms
  labels:
    app.kubernetes.io/name: titanops-alb-ingress
    app.kubernetes.io/part-of: titanops-hms
    app.kubernetes.io/managed-by: aws-load-balancer-controller
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:123456789012:certificate/titanops-wildcard
    alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:ap-south-1:123456789012:regional/webacl/titanops-dev-alb-waf
    alb.ingress.kubernetes.io/custom-response-headers: |
      Strict-Transport-Security: max-age=31536000; includeSubDomains; preload
      X-Frame-Options: SAMEORIGIN
      X-Content-Type-Options: nosniff
      Referrer-Policy: strict-origin-when-cross-origin
      Permissions-Policy: camera=(), microphone=(), geolocation=(), payment=()
      Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' http: https:; frame-ancestors 'self';
    # Health check against the frontend nginx /health endpoint (matches
    # frontend/nginx.conf and the frontend Deployment liveness/readiness probes).
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/success-codes: '200,301,302'
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          # All traffic (UI, static assets, and same-origin /api/* calls) goes to
          # the frontend Service; nginx inside the frontend pod fans /api/* out to
          # the individual microservices.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

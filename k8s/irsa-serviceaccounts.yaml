# ==============================================================================
# TitanOps HMS: Kubernetes ServiceAccounts with IRSA Annotations - TITANOPS-120
# Purpose: Maps each microservice's in-cluster ServiceAccount to its dedicated
#          least-privilege AWS IAM role using EKS IAM Roles for Service Accounts.
# ==============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: titanops
  labels:
    app.kubernetes.io/part-of: titanops-hms
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: billing-service
  namespace: titanops
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/titanops-dev-billing-service-irsa-role
  labels:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/part-of: titanops-hms
    app.kubernetes.io/component: backend
---

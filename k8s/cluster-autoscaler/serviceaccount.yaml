    k8s-app: cluster-autoscaler
    app.kubernetes.io/name: cluster-autoscaler
    app.kubernetes.io/part-of: titanops-hms
  annotations:
    # AWS IAM Role for Service Accounts (IRSA)
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/titanops-hms-cluster-autoscaler-role

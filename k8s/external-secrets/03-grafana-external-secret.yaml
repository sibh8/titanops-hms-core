# ==============================================================================
# TitanOps HMS: Grafana Admin ExternalSecret (TITANOPS-127)
# Syncs AWS Secrets Manager Grafana credentials into K8s Secret grafana-admin-credentials
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: titanops-grafana-externalsecret
  namespace: hms
  labels:
    app.kubernetes.io/name: titanops-grafana-externalsecret
    app.kubernetes.io/part-of: titanops-hms
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: titanops/dev/grafana
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: titanops/dev/grafana
        property: admin-password

# ==============================================================================
# TitanOps HMS: External Secrets Operator (ESO) SecretStore (TITANOPS-127)
# Connects Kubernetes to AWS Secrets Manager using AWS IRSA (No Static IAM Keys)
# ==============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: hms
  labels:
    app.kubernetes.io/name: external-secrets-operator
    app.kubernetes.io/part-of: titanops-hms
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/titanops-dev-external-secrets-role
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: hms
  labels:
    app.kubernetes.io/name: aws-secretsmanager
    app.kubernetes.io/part-of: titanops-hms
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa

# ==============================================================================
# TitanOps HMS: RDS Database ExternalSecret (TITANOPS-127)
# Syncs AWS Secrets Manager DB credentials into K8s Secret titanops-datasource-credentials
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: titanops-datasource-externalsecret
  namespace: hms
  labels:
    app.kubernetes.io/name: titanops-datasource-externalsecret
    app.kubernetes.io/part-of: titanops-hms
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: titanops-datasource-credentials
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_URL
      remoteRef:
        key: titanops/dev/database
        property: SPRING_DATASOURCE_URL
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: titanops/dev/database
        property: SPRING_DATASOURCE_USERNAME
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: titanops/dev/database
        property: SPRING_DATASOURCE_PASSWORD

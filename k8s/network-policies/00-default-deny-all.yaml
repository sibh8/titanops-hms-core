# CIS Kubernetes Benchmark 5.3.2: Ensure that all namespaces have network policies defined
# Default Deny: Isolates all pods in the namespace from all ingress and egress traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: hms
  labels:
    app.kubernetes.io/part-of: medicore-hms
    app.kubernetes.io/managed-by: titanops
    security.titanops.io/policy-type: baseline-deny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

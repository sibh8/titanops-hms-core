# ==============================================================================
# TitanOps HMS: In-cluster MySQL — plain StatefulSet + Service
# Uses official MySQL 8.0 from ECR Public (no init containers, no Bitnami chart)
# Database: medicore_hms  |  Namespace: hms
# Service DNS: mysql.hms.svc.cluster.local:3306
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: hms
  labels:
    app: mysql
    app.kubernetes.io/name: mysql
    app.kubernetes.io/part-of: titanops-hms
spec:
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      protocol: TCP
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: hms
  labels:
    app: mysql
    app.kubernetes.io/name: mysql
    app.kubernetes.io/part-of: titanops-hms
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
        app.kubernetes.io/name: mysql
    spec:
      containers:
        - name: mysql
          # Official MySQL 8.0 from AWS ECR Public — no Docker Hub rate limits
          image: public.ecr.aws/docker/library/mysql:8.0
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "medicore_root_pass"
            - name: MYSQL_DATABASE
              value: "medicore_hms"
            - name: MYSQL_USER
              value: "medicore"
            - name: MYSQL_PASSWORD
              value: "medicore_pass"
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - "mysql -u medicore -pmedicore_pass -e 'SELECT 1' medicore_hms"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - "mysqladmin ping -u root -pmedicore_root_pass"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          # No persistence — uses emptyDir (in-pod storage, fine for capstone demo)
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-data
          emptyDir: {}

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-root-containers
  annotations:
    policies.kyverno.io/title: Disallow Root Containers
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Containers must run as a non-root user. Running containers as root provides
      potential attackers with root privileges on the underlying host system in the
      event of a container breakout.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
                - Deployment
                - DaemonSet
                - StatefulSet
                - Job
                - CronJob
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
      validate:
        message: >-
          validation failure: running as root is prohibited. Containers must set
          securityContext.runAsNonRoot: true and securityContext.runAsUser > 0.
        pattern:
          spec:
            =(securityContext):
              runAsNonRoot: true
            =(template):
              spec:
                =(securityContext):
                  runAsNonRoot: true
                containers:
                  - =(securityContext):
                      runAsNonRoot: true
                      runAsUser: ">0"

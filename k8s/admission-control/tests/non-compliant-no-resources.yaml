apiVersion: apps/v1
kind: Deployment
metadata:
  name: non-compliant-no-resources-app
  namespace: hms
  labels:
    app: noisy-neighbor-app
    tier: non-compliant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: noisy-neighbor-app
  template:
    metadata:
      labels:
        app: noisy-neighbor-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: unbounded-container
          image: busybox:latest
          command: ["sh", "-c", "sleep 3600"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # Resources intentionally omitted to trigger rejection

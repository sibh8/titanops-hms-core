apiVersion: v1
kind: ServiceAccount
metadata:
  name: kyverno-admission-controller
  namespace: kyverno
  labels:
    app.kubernetes.io/name: kyverno
    app.kubernetes.io/component: admission-controller
    app.kubernetes.io/part-of: titanops-hms
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:admission-controller
  labels:
    app.kubernetes.io/name: kyverno
    app.kubernetes.io/component: admission-controller
    app.kubernetes.io/part-of: titanops-hms
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "services", "configmaps", "secrets"]
    verbs: ["create", "update", "delete", "get", "list", "watch", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["create", "update", "delete", "get", "list", "watch", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["create", "update", "delete", "get", "list", "watch", "patch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations", "mutatingwebhookconfigurations"]
    verbs: ["create", "update", "delete", "get", "list", "watch", "patch"]
  - apiGroups: ["kyverno.io"]
    resources: ["clusterpolicies", "policies", "clusteradmissionreports", "admissionreports"]
    verbs: ["create", "update", "delete", "get", "list", "watch", "patch"]
  - apiGroups: ["kyverno.io"]
    resources: ["clusterpolicies/status", "policies/status"]
    verbs: ["update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "update", "delete", "get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kyverno:admission-controller
  labels:
    app.kubernetes.io/name: kyverno
    app.kubernetes.io/component: admission-controller
    app.kubernetes.io/part-of: titanops-hms
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kyverno:admission-controller
subjects:
  - kind: ServiceAccount
    name: kyverno-admission-controller
    namespace: kyverno
---
apiVersion: v1
kind: Service
metadata:
  name: kyverno-svc
  namespace: kyverno
  labels:
    app.kubernetes.io/name: kyverno
    app.kubernetes.io/component: admission-controller
    app.kubernetes.io/part-of: titanops-hms
spec:
  ports:
    - name: https-webhook
      port: 443
      targetPort: 9443
      protocol: TCP
    - name: metrics
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app.kubernetes.io/name: kyverno
    app.kubernetes.io/component: admission-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyverno-admission-controller
  namespace: kyverno
  labels:
    app.kubernetes.io/name: kyverno
    app.kubernetes.io/component: admission-controller
    app.kubernetes.io/part-of: titanops-hms
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kyverno
      app.kubernetes.io/component: admission-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kyverno
        app.kubernetes.io/component: admission-controller
    spec:
      serviceAccountName: kyverno-admission-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kyverno
          image: ghcr.io/kyverno/kyverno:v1.12.5
          imagePullPolicy: IfNotPresent
          args:
            - --webhookTimeout=10
            - --v=2
            - --backgroundScanInterval=1h
          ports:
            - containerPort: 9443
              name: https-webhook
              protocol: TCP
            - containerPort: 8000
              name: metrics
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 9443
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 9443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: kyverno-resource-validating-webhook-cfg
  labels:
    app.kubernetes.io/name: kyverno
    app.kubernetes.io/component: admission-controller
    app.kubernetes.io/part-of: titanops-hms
webhooks:
  - name: validate.kyverno.svc-fail
    clientConfig:
      service:
        name: kyverno-svc
        namespace: kyverno
        path: /validate/fail
    rules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["", "apps", "batch"]
        apiVersions: ["v1"]
        resources: ["pods", "deployments", "daemonsets", "statefulsets", "jobs", "cronjobs"]
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "kyverno"]

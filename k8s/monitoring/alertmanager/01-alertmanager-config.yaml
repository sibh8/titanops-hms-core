# ==============================================================================
# TitanOps HMS: Alertmanager Configuration Manifest (TITANOPS-42)
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: titanops-hms
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      slack_api_url: 'https://hooks.slack.com/services/TITANOPS/ALERTS/WEBHOOK'

    route:
      group_by: ['alertname', 'namespace', 'service']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'slack-notifications'
      routes:
        - match:
            severity: critical
          receiver: 'slack-critical'
          continue: true
        - match:
            team: security
          receiver: 'security-webhook'

    receivers:
      - name: 'slack-notifications'
        slack_configs:
          - channel: '#titanops-alerts'
            send_resolved: true
            title: '{{ template "slack.default.title" . }}'
            text: >-
              *Alert:* {{ .CommonAnnotations.summary }}
              *Severity:* `{{ .CommonLabels.severity }}`
              *Description:* {{ .CommonAnnotations.description }}
              *Runbook:* {{ .CommonAnnotations.runbook_url }}

      - name: 'slack-critical'
        slack_configs:
          - channel: '#titanops-critical-incidents'
            send_resolved: true
            title: '🚨 CRITICAL ALERT: {{ .CommonAnnotations.summary }}'
            text: >-
              *Service:* `{{ .CommonLabels.service }}`
              *Namespace:* `{{ .CommonLabels.namespace }}`
              *Details:* {{ .CommonAnnotations.description }}

      - name: 'security-webhook'
        webhook_configs:
          - url: 'http://alert-gateway.monitoring.svc.cluster.local:8080/security-events'
            send_resolved: true

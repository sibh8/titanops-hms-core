# ==============================================================================
# TitanOps HMS: GitHub Actions Metrics Exporter Deployment (TITANOPS-41)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-actions-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: github-actions-exporter
    app.kubernetes.io/part-of: titanops-hms
    app.kubernetes.io/component: ci-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: github-actions-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: github-actions-exporter
        app.kubernetes.io/part-of: titanops-hms
        app.kubernetes.io/component: ci-monitoring
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: github-actions-exporter
          image: ghcr.io/cpanato/github-actions-exporter:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: GITHUB_ORG
              value: "sibh8"
            - name: GITHUB_REPO
              value: "titanops-hms-core"
            - name: GITHUB_REFRESH_INTERVAL
              value: "30s"
            - name: PORT
              value: "9999"
          ports:
            - name: metrics
              containerPort: 9999
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9999
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9999
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: github-actions-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: github-actions-exporter
    app.kubernetes.io/part-of: titanops-hms
    app.kubernetes.io/component: ci-monitoring
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9999"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: github-actions-exporter
  ports:
    - name: metrics
      port: 9999
      targetPort: 9999
      protocol: TCP

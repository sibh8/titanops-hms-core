    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "title": "CI/CD Pipeline Overview",
          "type": "row"
        },
        {
          "id": 2,
          "title": "Workflow Success Rate (%)",
          "type": "gauge",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 1 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(github_workflow_run_status{conclusion=\"success\"}) / (sum(github_workflow_run_status{conclusion=~\"success|failure\"}) + 0.0001) * 100",
              "legendFormat": "Success Rate"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 85 },
                  { "color": "green", "value": 95 }
                ]
              }
            }
          }
        },
        {
          "id": 3,
          "title": "Failed Workflow Runs (Last 24h)",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 1 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(increase(github_workflow_run_status{conclusion=\"failure\"}[24h])) or vector(0)",
              "legendFormat": "Failures"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            }
          }
        },
        {
          "id": 4,
          "title": "Successful Workflow Runs (Last 24h)",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 1 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(increase(github_workflow_run_status{conclusion=\"success\"}[24h])) or vector(0)",
              "legendFormat": "Successes"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" }
            }
          }
        },

# ==============================================================================
# TitanOps HMS: Prometheus Server Configuration ConfigMap (TITANOPS-39 / TITANOPS-74)
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: titanops-hms
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      scrape_timeout: 10s

    rule_files:
      - /etc/prometheus/rules/*.yaml

    scrape_configs:
      # ------------------------------------------------------------------------
      # Self Monitoring
      # ------------------------------------------------------------------------
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # ------------------------------------------------------------------------
      # Kubernetes API Server Metrics
      # ------------------------------------------------------------------------
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https

      # ------------------------------------------------------------------------
      # Kubernetes Kubelet & Node Health Metrics
      # ------------------------------------------------------------------------
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics

      # ------------------------------------------------------------------------
      # Kubernetes cAdvisor Container Resource Metrics
      # ------------------------------------------------------------------------
      - job_name: 'kubernetes-cadvisor'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

      # ------------------------------------------------------------------------
      # Kubernetes Service Endpoints Auto-Discovery
      # ------------------------------------------------------------------------
      - job_name: 'kubernetes-service-endpoints'
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_service_name]
            action: replace
            target_label: kubernetes_service_name

      # ------------------------------------------------------------------------
      # TitanOps HMS: Microservices Dynamic Service Discovery (TITANOPS-74)
      # ------------------------------------------------------------------------
      - job_name: 'titanops-microservices-sd'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - hms
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: (patient|user|appointment|provider|encounter|billing|lab|medication|prescription)-service
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
          - target_label: __metrics_path__
            replacement: /actuator/prometheus
          - source_labels: [__meta_kubernetes_service_name]
            target_label: app
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace

      # ------------------------------------------------------------------------
      # TitanOps HMS: Ported Microservices Direct In-Cluster Scrape Jobs (TITANOPS-74)
      # ------------------------------------------------------------------------
      - job_name: 'otel-collector'
        static_configs:
          - targets: ['otel-collector.hms.svc.cluster.local:8889']

      - job_name: 'patient-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['patient-service.hms.svc.cluster.local:8081']

      - job_name: 'user-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['user-service.hms.svc.cluster.local:8082']

      - job_name: 'appointment-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['appointment-service.hms.svc.cluster.local:8083']

      - job_name: 'provider-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['provider-service.hms.svc.cluster.local:8084']

      - job_name: 'encounter-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['encounter-service.hms.svc.cluster.local:8085']

      - job_name: 'billing-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['billing-service.hms.svc.cluster.local:8086']

      - job_name: 'lab-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['lab-service.hms.svc.cluster.local:8087']

      - job_name: 'medication-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['medication-service.hms.svc.cluster.local:8088']

      - job_name: 'prescription-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['prescription-service.hms.svc.cluster.local:8089']

# ==============================================================================
# TitanOps HMS: kube-prometheus-stack Helm Chart Values (TITANOPS-39)
# ==============================================================================
fullnameOverride: prometheus-stack

defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false
    k8s: true
    kubeApiserver: true
    kubePrometheusNodeAlerting: true
    network: true
    node: true
    prometheus: true

prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 15d
    retentionSize: "25Gi"
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 30Gi
    securityContext:
      runAsUser: 65534
      runAsNonRoot: true
      fsGroup: 65534
    additionalScrapeConfigs:
      - job_name: 'titanops-microservices-sd'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - hms
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: (patient|user|appointment|provider|encounter|billing|lab|medication|prescription)-service
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
          - target_label: __metrics_path__
            replacement: /actuator/prometheus
          - source_labels: [__meta_kubernetes_service_name]
            target_label: app
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
      - job_name: 'github-actions-exporter'
        static_configs:
          - targets: ['github-actions-exporter.monitoring.svc.cluster.local:9999']
      - job_name: 'pushgateway'
        honor_labels: true
        static_configs:
          - targets: ['pushgateway.monitoring.svc.cluster.local:9091']

nodeExporter:
  enabled: true
  tolerations:
    - effect: NoSchedule
      operator: Exists

kubeStateMetrics:
  enabled: true

alertmanager:
  enabled: true
  alertmanagerSpec:
    retention: 120h
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

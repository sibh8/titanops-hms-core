# ==============================================================================
# TitanOps HMS: Kubernetes Frontend Deployment & Service Manifest (TITANOPS-70)
# Nginx-served Vite/React Single Page Application with AWS LoadBalancer & Ingress
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: hms
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: titanops-hms
    app.kubernetes.io/component: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: titanops-hms
    spec:
      serviceAccountName: frontend-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: 561789488706.dkr.ecr.ap-south-1.amazonaws.com/medicore/frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
            - name: var-cache-dir
              mountPath: /var/cache/nginx
            - name: var-run-dir
              mountPath: /var/run
      volumes:
        - name: tmp-dir
          emptyDir: {}
        - name: var-cache-dir
          emptyDir: {}
        - name: var-run-dir
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: hms
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: titanops-hms
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: frontend
# NOTE: The public ALB Ingress for the frontend is defined once in
# k8s/ingress/01-alb-ingress-tls.yaml (with ACM TLS, HTTPS redirect, WAF, and
# hardened response headers). A second bare Ingress here would provision a
# duplicate, non-TLS ALB fronting the same Service, so it has been removed.
# This file now owns only the frontend Deployment and Service.

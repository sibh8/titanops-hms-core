# ==============================================================================
# TitanOps HMS: Kubernetes DataSource Secret Template (TITANOPS-71)
# Stores Spring Boot database connection credentials pointing to AWS RDS MySQL.
# Injected into all 9 microservices via envFrom.
# NOTE: This file is a declarative template. Production secrets are populated
# dynamically at deployment time via External Secrets Operator or CI/CD pipelines.
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: titanops-datasource-credentials
  namespace: hms
  labels:
    app.kubernetes.io/name: titanops-datasource-credentials
    app.kubernetes.io/part-of: titanops-hms
    app.kubernetes.io/managed-by: Helm
type: Opaque
stringData:
  SPRING_DATASOURCE_URL: "${SPRING_DATASOURCE_URL:-jdbc:mysql://titanops-dev-mysql.cluster-xyz.us-east-1.rds.amazonaws.com:3306/medicore_hms?useSSL=true&requireSSL=true}"
  SPRING_DATASOURCE_USERNAME: "${SPRING_DATASOURCE_USERNAME:-medicore}"
  SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD}"

image:
  repository: ghcr.io/sibh8/titanops-hms-core/billing-service
  tag: latest

service:
  port: 8084
  targetPort: 8084

env:
  SPRING_DATASOURCE_URL: "jdbc:mysql://medicore-mysql:3306/medicore_hms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
  SPRING_DATASOURCE_USERNAME: "medicore"
  SPRING_DATASOURCE_PASSWORD: "medicore_pass"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  OTEL_SERVICE_NAME: "billing-service"

networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/instance
                operator: In
                values: ["frontend", "medicore-hms-ui"]
      ports:
        - protocol: TCP
          port: 8084
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/instance
                operator: In
                values: ["medicore-mysql", "mysql"]
      ports:
        - protocol: TCP
          port: 3306
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 3306
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/instance
                operator: In
                values: ["otel-collector"]
      ports:
        - protocol: TCP
          port: 4317


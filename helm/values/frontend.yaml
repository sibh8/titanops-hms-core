image:
  repository: ghcr.io/sibh8/titanops-hms-core/medicore-hms-ui
  tag: latest

service:
  port: 80
  targetPort: 80

env:
  VITE_API_BASE_URL: ""

probes:
  livenessPath: /health
  readinessPath: /health

networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/instance
                operator: In
                values:
                  - patient-service
                  - appointment-service
                  - user-service
                  - billing-service
                  - encounter-service
                  - lab-service
                  - medication-service
                  - prescription-service
                  - provider-service
      ports:
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8082
        - protocol: TCP
          port: 8083
        - protocol: TCP
          port: 8084
        - protocol: TCP
          port: 8085
        - protocol: TCP
          port: 8086
        - protocol: TCP
          port: 8087
        - protocol: TCP
          port: 8088
        - protocol: TCP
          port: 8089
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/instance
                operator: In
                values: ["otel-collector"]
      ports:
        - protocol: TCP
          port: 4318


image:
  repository: ghcr.io/sibh8/titanops-hms-core/patient-service
  tag: latest

service:
  port: 8081
  targetPort: 8081

env:
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  OTEL_SERVICE_NAME: "patient-service"

envFrom:
  - secretRef:
      name: titanops-datasource-credentials

networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/instance
                operator: In
                values: ["frontend", "medicore-hms-ui"]
      ports:
        - protocol: TCP
          port: 8081
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/instance
                operator: In
                values: ["medicore-mysql", "mysql"]
      ports:
        - protocol: TCP
          port: 3306
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 3306
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/instance
                operator: In
                values: ["otel-collector"]
      ports:
        - protocol: TCP
          port: 4317


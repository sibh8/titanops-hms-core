# Default values for titanops-base.
# This base chart serves as the common foundational abstraction for all MediCore HMS services.
# Environment-specific overrides should be supplied via values-dev.yaml, values-staging.yaml, or values-prod.yaml.

environment: "dev"
replicaCount: 1

image:
  repository: ghcr.io/sibh8/titanops-hms-core/patient-service
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

env: {}
envFrom: []

probes:
  livenessPath: /actuator/health/liveness
  readinessPath: /actuator/health/readiness

networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []


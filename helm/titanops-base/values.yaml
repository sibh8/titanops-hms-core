# ==============================================================================
# Default values for titanops-base.
# This base chart serves as the common foundational abstraction for all MediCore HMS services.
# Environment-specific overrides should be supplied via values-dev.yaml, values-staging.yaml, or values-prod.yaml.
# ==============================================================================

environment: "dev"
replicaCount: 1

image:
  repository: ghcr.io/sibh8/titanops-hms-core/patient-service
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Pod Security Standards (PSS) enforcement: keep workloads non-root, deny privilege escalation,
# and reserve CPU/memory to satisfy cluster admission policies.
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: http
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

env: {}
envFrom: []

probes:
  livenessPath: /actuator/health/liveness
  readinessPath: /actuator/health/readiness

networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []

# ==============================================================================
# Multi-Workload Definitions for all 10 Services (TITANOPS-72)
# Enumerates all 9 Spring Boot microservices + React/Vite frontend
# ==============================================================================
services:
  patient-service:
    port: 8081
    image:
      repository: medicore/patient-service
      tag: latest
    env:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_SERVICE_NAME: "patient-service"
    envFrom:
      - secretRef:
          name: titanops-datasource-credentials
    probes:
      livenessPath: /actuator/health/liveness
      readinessPath: /actuator/health/readiness

  appointment-service:

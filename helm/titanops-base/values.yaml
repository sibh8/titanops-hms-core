# Default values for titanops-base.
replicaCount: 1

image:
  repository: ghcr.io/sibh8/titanops-hms-core/patient-service
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: false

resources: {}
autoscaling:
  enabled: false

env: {}

probes:
  livenessPath: /actuator/health/liveness
  readinessPath: /actuator/health/readiness

version: '3.8'

x-db-env: &db-env
  # TITANOPS-119: Enforce TLS encryption and server certificate verification against database.
  # MySQL's auto-generated server cert is signed by its own CA (ca.pem), which the JVM does not
  # trust by default. The mysql-truststore service imports that CA into a PKCS12 truststore and
  # Connector/J verifies the server certificate against it.
  SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/medicore_hms?useSSL=true&requireSSL=true&verifyServerCertificate=true&trustCertificateKeyStoreUrl=file:/etc/mysql-truststore/mysql-truststore.p12&trustCertificateKeyStoreType=PKCS12&trustCertificateKeyStorePassword=${MYSQL_TRUSTSTORE_PASSWORD:-changeit}&serverTimezone=UTC}
  SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-medicore}
  SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-medicore_pass}
  SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}

x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
  OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
  OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-otlp}  
  OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-otlp}
  # Port 4317 is the collector's gRPC receiver; the agent defaults to http/protobuf.
  OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
  SPRING_AUTOCONFIGURE_EXCLUDE: io.opentelemetry.instrumentation.spring.autoconfigure.OpenTelemetryAutoConfiguration

# Shared by all Spring microservices: wait for MySQL and its CA truststore, mount it read-only.
x-db-depends: &db-depends
  mysql:
    condition: service_healthy
  mysql-truststore:
    condition: service_completed_successfully

x-db-volumes: &db-volumes
  - mysql_truststore:/etc/mysql-truststore:ro

services:

  # ─── Database ──────────────────────────────────────────────────────────────
  # TITANOPS-118 NOTE:
  # This containerized MySQL service is strictly intended for local offline
  # development, testing, and sandbox environments (docker-compose).
  # In Kubernetes / AWS EKS production deployments, this container is NOT used;
  # all 9 microservices connect directly to the managed, Multi-AZ, KMS-encrypted
  # AWS RDS MySQL instance provisioned via Terraform (terraform/modules/rds).
  mysql:
    image: mysql:8.0
    container_name: medicore-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-medicore_hms}
      MYSQL_USER: ${SPRING_DATASOURCE_USERNAME:-medicore}
      MYSQL_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-medicore_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${SPRING_DATASOURCE_USERNAME:-medicore}", "-p${SPRING_DATASOURCE_PASSWORD:-medicore_pass}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # One-shot job: build a JVM truststore from MySQL's auto-generated CA (ca.pem in the data dir)
  # so the services can keep verifyServerCertificate=true against the local container.
  mysql-truststore:
    image: eclipse-temurin:11.0.25_9-jre
    environment:
      MYSQL_TRUSTSTORE_PASSWORD: ${MYSQL_TRUSTSTORE_PASSWORD:-changeit}
    volumes:
      - mysql_data:/mysql-data:ro
      - mysql_truststore:/truststore
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        rm -f /truststore/mysql-truststore.p12
        keytool -importcert -noprompt -alias mysql-ca \
          -file /mysql-data/ca.pem \
          -keystore /truststore/mysql-truststore.p12 -storetype PKCS12 \
          -storepass "$$MYSQL_TRUSTSTORE_PASSWORD"
        chmod 644 /truststore/mysql-truststore.p12
        echo "MySQL CA truststore created"
    depends_on:
      mysql:
        condition: service_healthy

  # ─── Observability ─────────────────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.57.0
    container_name: medicore-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger UI
      - "14250:14250" # Jaeger gRPC collector
      - "14268:14268" # Jaeger HTTP collector

  otel-collector:
    image: otel/opentelemetry-collector:0.100.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
    depends_on:
      - jaeger

  prometheus:
    image: prom/prometheus:v2.51.2
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.4.2
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_DATASOURCES_DEFAULT_NAME=Prometheus
      - GF_DATASOURCES_DEFAULT_TYPE=prometheus
      - GF_DATASOURCES_DEFAULT_URL=http://prometheus:9090
      - GF_DATASOURCES_DEFAULT_ACCESS=proxy
      - GF_DATASOURCES_DEFAULT_IS_DEFAULT=true

  # ─── Microservices ─────────────────────────────────────────────────────────
  patient-service:
    build: ./patient-service
    ports:
      - "8081:8081"
    environment:
      <<: [*db-env, *otel-env]
      OTEL_SERVICE_NAME: patient-service
    volumes: *db-volumes
    depends_on: *db-depends

  appointment-service:
    build: ./appointment-service
    ports:
      - "8082:8082"
    environment:
      <<: [*db-env, *otel-env]
      OTEL_SERVICE_NAME: appointment-service
    volumes: *db-volumes
    depends_on: *db-depends

  user-service:
    build: ./user-service
    ports:
      - "8083:8083"
    environment:
      <<: [*db-env, *otel-env]
      OTEL_SERVICE_NAME: user-service
    volumes: *db-volumes
    depends_on: *db-depends

  billing-service:
    build: ./billing-service
    ports:
      - "8084:8084"
    environment:
      <<: [*db-env, *otel-env]
      OTEL_SERVICE_NAME: billing-service
    volumes: *db-volumes
    depends_on: *db-depends

  encounter-service:
    build: ./encounter-service
    ports:
      - "8085:8085"
    environment:
      <<: [*db-env, *otel-env]
      OTEL_SERVICE_NAME: encounter-service
    volumes: *db-volumes
    depends_on: *db-depends

  lab-service:
    build: ./lab-service
    ports:
      - "8086:8086"
    environment:
      <<: [*db-env, *otel-env]
      OTEL_SERVICE_NAME: lab-service
    volumes: *db-volumes
    depends_on: *db-depends

  medication-service:
    build: ./medication-service
    ports:
      - "8087:8087"
    environment:
      <<: [*db-env, *otel-env]
      OTEL_SERVICE_NAME: medication-service
    volumes: *db-volumes
    depends_on: *db-depends

  prescription-service:
    build: ./prescription-service
    ports:
      - "8088:8088"
    environment:
      <<: [*db-env, *otel-env]
      OTEL_SERVICE_NAME: prescription-service
    volumes: *db-volumes
    depends_on: *db-depends

  provider-service:
    build: ./provider-service
    ports:
      - "8089:8089"
    environment:
      <<: [*db-env, *otel-env]
      OTEL_SERVICE_NAME: provider-service
    volumes: *db-volumes
    depends_on: *db-depends

  # ─── Frontend ────────────────────────────────────────────────────────────────
  medicore-hms-ui:
    build: ./frontend
    container_name: medicore-hms-ui
    ports:
      - "3000:80"
    depends_on:
      - patient-service
      - appointment-service
      - user-service
      - billing-service
      - encounter-service
      - lab-service
      - medication-service
      - prescription-service
      - provider-service
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget resolves localhost to ::1 but nginx listens on IPv4 only
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mysql_data:
  mysql_truststore:
